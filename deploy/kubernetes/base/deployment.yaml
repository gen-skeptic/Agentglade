apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentglade
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentglade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentglade
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentglade
          image: ghcr.io/gen-skeptic/agentglade:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agentglade-config
          env:
            - name: AUTH_CONFIG_FILE
              value: /run/secrets/auth.json
            - name: AGENT_KEYS_FILE
              value: /run/secrets/agents.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentglade-data
        - name: media
          persistentVolumeClaim:
            claimName: agentglade-media
        - name: secrets
          secret:
            secretName: agentglade-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
