apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentglade-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentglade-media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
