apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentglade
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: agentglade-config
    literals:
      - PUBLIC_ORIGIN=http://localhost:8080
      - MAX_UPLOAD_MB=64
      - MEMBER_ACCOUNTS={}
      - MEMBER_ADMINS=[]
      - MEMBER_ROLES=[]
      - TRUSTED_PROXIES=[]
