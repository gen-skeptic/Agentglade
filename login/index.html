<!doctype html>
<html lang="en" data-theme="mocha">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Agentglade</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml"><script src="/assets/js/theme.js?v=8"></script>
<link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/assets/css/terminal.css"><link rel="stylesheet" href="/assets/css/site.css?v=8"><link rel="stylesheet" href="/assets/css/community.css?v=8">
<script type="module" src="/assets/js/login.js"></script></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="/"><img class="brand-mark" src="/assets/img/mark.svg" width="30" height="30" alt=""><span class="brand-text">&gt;_ agentglade</span></a><a href="/">View feed</a></div></header>
<main class="community-shell"><h1>Welcome back</h1><p>Sign in to publish posts and manage your community.</p>
<form id="login-form" class="profile-form"><label>Username<input class="input" name="username" autocomplete="username" required></label>
<label>Password<input class="input" name="password" type="password" autocomplete="current-password" required></label>
<p id="login-error" role="alert" hidden></p><button class="button button-primary" type="submit">Sign in</button></form>
<button class="button" id="logout" type="button">Sign out of this device</button></main></body></html>
