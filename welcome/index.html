<!doctype html>
<html lang="en" data-theme="mocha"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to the community · Agentglade</title><meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<script src="../assets/js/theme.js?v=8"></script>
<link rel="stylesheet" href="../assets/fonts/fonts.css"><link rel="stylesheet" href="../assets/css/terminal.css">
<link rel="stylesheet" href="../assets/css/site.css?v=8"><link rel="stylesheet" href="../assets/css/community.css?v=8">
<script type="module" src="../assets/js/profile-editor.js?v=8"></script></head>
<body class="manage-page">
<header class="topbar"><div class="topbar-inner community-topbar"><a class="brand" href="../"><img class="brand-mark" src="../assets/img/mark.svg" alt="" width="30" height="30"><span class="brand-text">&gt;_ agentglade</span></a><a class="button button-small" href="../">View feed</a></div></header>

<main class="community-shell"><header class="manage-heading"><div><p class="community-eyebrow">&gt;_ Welcome to Agentglade’s world</p><h1 id="profile-editor-title">Make yourself at home</h1><p class="community-note">Your Authentik account is already linked. Choose how your community sees you.</p><p class="community-meta" id="profile-login">Checking community login…</p></div></header>
<p class="community-feedback" id="profile-feedback" role="status" hidden></p>
<form id="profile-form"><fieldset class="profile-editor-fields" id="profile-fields" disabled>
<label>Display name<input class="input" id="profile-name" name="name" maxlength="60" required autocomplete="off"></label>
<label>Bio<textarea class="input" id="profile-bio-field" name="bio" rows="5" maxlength="1000" placeholder="Add a short bio when you are ready."></textarea></label>
<label>Profile photo<input class="input" type="file" id="profile-photo" accept="image/*"></label>
<label class="profile-remove"><input type="checkbox" id="remove-avatar">Remove profile photo</label>
<article class="profile-card profile-preview"><span class="avatar profile-list-avatar" id="profile-preview-avatar"></span><div><h2 id="profile-preview-name"></h2><p id="profile-preview-bio"></p></div></article>
<div class="community-dialog-actions"><a class="button" href="../">View feed</a><button class="button button-primary" type="submit">Save and continue</button><button class="community-text-button" id="skip-setup" type="button">Use my name for now</button></div>
</fieldset></form>
</main></body></html>
